<div id="login-area">
    <input type="email" id="email" placeholder="Seu melhor e-mail">
    <button class="btn" id="btn-assinar" onclick="assinar()">Assinar (R$ 29/mês)</button>
</div>

<div id="mensagem"></div>

<script>
    // ⚠️ IMPORTANTE: Substitua pela URL do seu backend no Render
    const API_URL = 'https://SEU_BACKEND.onrender.com';
    
    async function assinar() {
        const email = document.getElementById('email').value;
        const btn = document.getElementById('btn-assinar');
        const msg = document.getElementById('mensagem');
        
        if(!email) {
            msg.innerHTML = '<p class="error">❌ Digite seu e-mail</p>';
            return;
        }
        
        // Validação básica de email
        if(!email.includes('@') || !email.includes('.')) {
            msg.innerHTML = '<p class="error">❌ E-mail inválido</p>';
            return;
        }
        
        btn.disabled = true;
        btn.innerText = 'Gerando link...';
        msg.innerHTML = '';
        
        try {
            console.log('Tentando conectar com:', API_URL + '/api/subscribe');
            
            const res = await fetch(API_URL + '/api/subscribe', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ email })
            });
            
            const data = await res.json();
            
            if(data.url) {
                msg.innerHTML = '<p class="success">✅ Redirecionando para pagamento...</p>';
                setTimeout(() => {
                    window.location.href = data.url;
                }, 1000);
            } else {
                throw new Error(data.error || 'Erro ao gerar link de pagamento');
            }
        } catch (erro) {
            console.error('Erro:', erro);
            msg.innerHTML = `<p class="error">❌ Erro: ${erro.message}</p>`;
            btn.disabled = false;
            btn.innerText = 'Assinar (R$ 29/mês)';
        }
    }
</script>
