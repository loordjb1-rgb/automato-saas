<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Autômato SaaS - Renda Automática</title>
    <style>
        body { font-family: sans-serif; background: #111; color: #fff; text-align: center; padding: 50px; }
        h1 { color: #00ff88; }
        .btn { background: #00ff88; color: #000; padding: 15px 30px; text-decoration: none; border-radius: 5px; font-weight: bold; cursor: pointer; border: none; font-size: 18px; }
        input { padding: 10px; width: 300px; margin-right: 10px; }
    </style>
</head>
<body>
    <h1>🤖 Autômato SaaS</h1>
    <p>Gere produtos digitais e renda enquanto dorme.</p>
    
    <div id="login-area">
        <input type="email" id="email" placeholder="Seu melhor e-mail">
        <button class="btn" onclick="assinar()">Assinar (R$ 29/mês)</button>
    </div>

    <script>
        async function assinar() {
            const email = document.getElementById('email').value;
            if(!email) return alert('Digite seu e-mail');
            
            const res = await fetch('/api/subscribe', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ email })
            });
            const data = await res.json();
            if(data.url) window.location.href = data.url;
        }
    </script>
</body>
</html>
